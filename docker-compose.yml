services:
  db:
    image: postgres:16-alpine
    container_name: resume_matcher_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_matcher
      POSTGRES_USER: resume_matcher
      POSTGRES_PASSWORD: kelvin
    ports:
      - "5432:5432"
    volumes:
      - resume_matcher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_matcher -d resume_matcher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resume_matcher_pgdata:
